<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --ink:#0d0d14;
  --ink2:#1a1a2e;
  --surface:#ffffff;
  --surface2:#f4f3f0;
  --surface3:#eeecea;
  --accent:#ff5c35;
  --accent2:#7c5cfc;
  --accent3:#00c896;
  --gold:#f5b800;
  --text:#0d0d14;
  --text-soft:#6b6880;
  --text-muted:#9b97ab;
  --border:#e0ddd8;
  --border2:#ccc9c0;
  --shadow:rgba(13,13,20,0.08);
  --shadow-heavy:rgba(13,13,20,0.18);
  --radius:14px;
  --radius-sm:8px;
  --radius-lg:22px;
  --font-display:'Syne',sans-serif;
  --font-body:'DM Sans',sans-serif;
}

[data-theme="dark"]{
  --ink:#f0efe8;
  --ink2:#e0ddd8;
  --surface:#111118;
  --surface2:#1a1a24;
  --surface3:#22222e;
  --accent:#ff6b47;
  --accent2:#9d7dff;
  --accent3:#00e6ab;
  --gold:#f5c842;
  --text:#f0efe8;
  --text-soft:#a09cba;
  --text-muted:#6b6880;
  --border:#2a2a38;
  --border2:#3a3a4e;
  --shadow:rgba(0,0,0,0.3);
  --shadow-heavy:rgba(0,0,0,0.5);
}

body{
  font-family:var(--font-body);
  background:var(--surface);
  color:var(--text);
  transition:background 0.3s,color 0.3s;
  min-height:100vh;
  overflow-x:hidden;
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ─── THEME TOGGLE ─── */
#theme-toggle{
  position:fixed;top:20px;right:20px;z-index:9999;
  width:44px;height:44px;border-radius:50%;
  background:var(--surface2);border:1.5px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all 0.25s;box-shadow:0 2px 12px var(--shadow);
}
#theme-toggle:hover{transform:rotate(20deg) scale(1.1)}

/* ─── SCREENS ─── */
.screen{display:none;min-height:100vh;width:100%}
.screen.active{display:flex;flex-direction:column}
#main-app{padding-bottom:72px}

/* ─── AUTH SCREENS ─── */
#login-screen,#signup-screen{
  background:var(--surface);
  align-items:center;justify-content:center;padding:20px;
  position:relative;overflow:hidden;
}
#login-screen::before,#signup-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 10% 90%, rgba(124,92,252,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 10%, rgba(255,92,53,0.1) 0%, transparent 60%);
  pointer-events:none;
}

.auth-card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:24px;
  padding:44px 40px;
  width:100%;max-width:420px;
  box-shadow:0 20px 60px var(--shadow-heavy);
  position:relative;z-index:1;
  animation:fadeUp 0.45s cubic-bezier(0.22,1,0.36,1);
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

.auth-logo{
  display:flex;align-items:center;gap:10px;margin-bottom:32px;
}
.auth-logo-icon{
  width:40px;height:40px;background:var(--accent);border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;
}
.auth-logo-name{
  font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.5px;
}

.auth-card h2{
  font-family:var(--font-display);font-size:26px;font-weight:800;
  letter-spacing:-0.5px;margin-bottom:6px;
}
.auth-sub{font-size:14px;color:var(--text-soft);margin-bottom:28px}

/* ─── FORM ELEMENTS ─── */
.form-group{margin-bottom:18px}
.form-label{
  display:block;font-size:12px;font-weight:600;
  letter-spacing:0.6px;text-transform:uppercase;
  color:var(--text-soft);margin-bottom:7px;
}
.form-input{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-family:var(--font-body);font-size:14.5px;
  background:var(--surface2);color:var(--text);
  transition:all 0.2s;outline:none;
}
.form-input:focus{border-color:var(--accent2);background:var(--surface);box-shadow:0 0 0 3px rgba(124,92,252,0.12)}
textarea.form-input{min-height:110px;resize:vertical;line-height:1.6}

.pw-wrap{position:relative}
.pw-wrap .form-input{padding-right:44px}
.pw-eye{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--text-muted);cursor:pointer;
  font-size:15px;padding:4px;transition:color 0.2s;
}
.pw-eye:hover{color:var(--accent2)}

.checkbox-row{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.checkbox-row input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:var(--accent2)}

/* ─── BUTTONS ─── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border:none;border-radius:var(--radius-sm);
  font-family:var(--font-body);font-size:14.5px;font-weight:500;
  cursor:pointer;transition:all 0.2s;text-decoration:none;
}
.btn-primary{
  width:100%;padding:13px;
  background:var(--accent);color:#fff;border-radius:10px;
  font-weight:600;font-size:15px;margin-top:8px;
}
.btn-primary:hover{background:#e04a26;transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,92,53,0.3)}
.btn-primary:active{transform:translateY(0)}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:7px}
.btn-ghost{background:var(--surface2);color:var(--text);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--border2);background:var(--surface3)}
.btn-danger{background:rgba(239,68,68,0.1);color:#ef4444}
.btn-danger:hover{background:rgba(239,68,68,0.18)}
.btn-success{background:rgba(0,200,150,0.12);color:var(--accent3)}
.btn-success:hover{background:rgba(0,200,150,0.2)}
.btn-accent2{background:rgba(124,92,252,0.12);color:var(--accent2)}
.btn-accent2:hover{background:rgba(124,92,252,0.2)}
.btn-icon{
  width:36px;height:36px;padding:0;border-radius:8px;
  background:var(--surface2);border:1.5px solid var(--border);color:var(--text-soft);
}
.btn-icon:hover{border-color:var(--border2);color:var(--text)}

.auth-link{display:block;text-align:center;margin-top:18px;font-size:13.5px;color:var(--text-soft)}
.auth-link a{color:var(--accent2);text-decoration:none;font-weight:500}
.auth-link a:hover{text-decoration:underline}

/* ─── TOAST / MESSAGE ─── */
.result-msg{
  margin-top:12px;padding:10px 14px;border-radius:8px;
  font-size:13.5px;font-weight:500;text-align:center;
  display:none;
}
.result-msg.show{display:block}
.result-msg.success{background:rgba(0,200,150,0.12);color:var(--accent3)}
.result-msg.error{background:rgba(239,68,68,0.1);color:#ef4444}

/* ─── HEADER ─── */
.app-header{
  background:var(--surface);border-bottom:1.5px solid var(--border);
  padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.header-brand{display:flex;align-items:center;gap:10px}
.header-brand-icon{
  width:34px;height:34px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;
}
.header-brand-name{
  font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-0.3px;
}
.header-user{font-size:13px;color:var(--text-soft)}
.header-user span{color:var(--text);font-weight:500}

/* ─── NAV ─── */
.nav-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1.5px solid var(--border);
  display:none;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  z-index:200;gap:4px;
}
.nav-bar.visible{display:flex;justify-content:space-around;align-items:center}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;cursor:pointer;
  padding:8px 12px;border-radius:10px;
  color:var(--text-muted);transition:all 0.2s;font-family:var(--font-body);
  min-width:56px;
}
.nav-btn i{font-size:18px}
.nav-btn span{font-size:10px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
.nav-btn.active{color:var(--accent);background:rgba(255,92,53,0.08)}

/* ─── APP SCREENS ─── */
.app-screen{display:none}
.app-screen.active{display:block}
.content{padding:20px 24px;max-width:860px;margin:0 auto}

/* ─── QUOTE ─── */
.quote-card{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--radius-lg);padding:20px 24px;
  margin-bottom:24px;position:relative;overflow:hidden;
}
.quote-card::before{
  content:'\201C';font-size:80px;font-family:Georgia,serif;
  color:var(--accent);opacity:0.15;position:absolute;top:-10px;left:14px;
  line-height:1;pointer-events:none;
}
.quote-card p{font-size:15px;line-height:1.7;color:var(--text-soft);font-style:italic;padding-left:10px}

/* ─── SECTION HEADER ─── */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.section-title{
  font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-0.3px;
}
.badge{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;
  background:var(--surface3);color:var(--text-soft);letter-spacing:0.3px;
}

/* ─── EMPTY STATE ─── */
.empty-state{
  text-align:center;padding:48px 20px;
  border:1.5px dashed var(--border2);border-radius:var(--radius-lg);
  color:var(--text-muted);
}
.empty-state i{font-size:36px;margin-bottom:12px;display:block;opacity:0.4}
.empty-state p{font-size:14px}

/* ─── TASK CARD ─── */
.tasks-list{display:flex;flex-direction:column;gap:12px}
.task-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:18px 20px;
  display:flex;align-items:flex-start;gap:14px;
  transition:all 0.2s;position:relative;overflow:hidden;
}
.task-card:hover{border-color:var(--border2);box-shadow:0 4px 16px var(--shadow)}
.task-card.important{border-left:3px solid var(--gold)}
.task-card.done{opacity:0.55}
.task-card.done .task-title{text-decoration:line-through;color:var(--text-muted)}

.task-check{
  width:22px;height:22px;flex-shrink:0;border-radius:6px;
  border:2px solid var(--border2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;margin-top:2px;background:var(--surface2);
}
.task-check:hover{border-color:var(--accent3)}
.task-check.checked{background:var(--accent3);border-color:var(--accent3);color:#fff}
.task-check i{font-size:11px}

.task-body{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:500;margin-bottom:4px;color:var(--text)}
.task-desc{font-size:13px;color:var(--text-soft);line-height:1.5;margin-bottom:10px}
.task-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.task-tag{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:var(--surface3);color:var(--text-soft);
}
.task-tag.important{background:rgba(245,184,0,0.15);color:var(--gold)}
.task-tag.overdue{background:rgba(239,68,68,0.12);color:#ef4444}

.progress-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.progress-bar{
  flex:1;height:5px;background:var(--surface3);border-radius:99px;overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent2),var(--accent3));
  transition:width 0.3s;
}
.progress-pct{font-size:11px;font-weight:700;color:var(--text-muted);min-width:30px;text-align:right}
.progress-slider{
  width:100%;height:4px;-webkit-appearance:none;appearance:none;
  background:transparent;outline:none;cursor:pointer;margin-top:4px;
}
.progress-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent2);border:2px solid var(--surface);
  box-shadow:0 1px 4px var(--shadow-heavy);
}
.progress-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--accent2);border:2px solid var(--surface);
}

.task-actions{display:flex;gap:6px;flex-shrink:0;align-self:flex-start}

/* ─── TASK FORM ─── */
.form-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-lg);padding:24px;margin-bottom:24px;
}
.form-card-title{
  font-family:var(--font-display);font-size:16px;font-weight:700;
  margin-bottom:20px;display:flex;align-items:center;gap:8px;
}
.form-card-title i{color:var(--accent);font-size:15px}

/* ─── NOTES ─── */
.notes-list{display:flex;flex-direction:column;gap:12px}
.note-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:18px 20px;
  border-left:3px solid var(--accent2);
  transition:all 0.2s;
}
.note-card:hover{border-color:var(--border2);box-shadow:0 4px 16px var(--shadow)}
.note-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.note-title{font-size:15px;font-weight:600;color:var(--text)}
.note-date{font-size:11px;color:var(--text-muted)}
.note-body{font-size:14px;color:var(--text-soft);line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-bottom:14px}
.note-foot{display:flex;gap:8px}

/* ─── AI CHAT ─── */
.ai-wrap{
  display:flex;flex-direction:column;
  height:calc(100vh - 140px);max-height:700px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;
}
.chat-messages{
  flex:1;overflow-y:auto;padding:20px;
  display:flex;flex-direction:column;gap:14px;
}
.msg{
  display:flex;gap:10px;animation:msgIn 0.25s ease;
  max-width:88%;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:14px;margin-top:2px;
}
.bot .msg-avatar{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff}
.user .msg-avatar{background:var(--surface3);color:var(--text-soft)}
.msg-bubble{
  padding:13px 16px;border-radius:14px;font-size:14px;line-height:1.65;
  word-break:break-word;
}
.bot .msg-bubble{
  background:var(--surface2);border:1.5px solid var(--border);
  border-bottom-left-radius:4px;color:var(--text);
}
.user .msg-bubble{
  background:var(--accent2);color:#fff;
  border-bottom-right-radius:4px;
}
.msg-bubble p{margin-bottom:6px}
.msg-bubble p:last-child{margin-bottom:0}
.msg-bubble ul,.msg-bubble ol{padding-left:18px;margin:6px 0}
.msg-bubble li{margin-bottom:3px}
.msg-bubble strong{font-weight:600}
.msg-bubble code{
  background:rgba(0,0,0,0.1);padding:1px 5px;border-radius:4px;
  font-family:monospace;font-size:12.5px;
}
.user .msg-bubble code{background:rgba(255,255,255,0.2)}
.msg-bubble pre{
  background:rgba(0,0,0,0.12);padding:10px;border-radius:8px;
  overflow-x:auto;margin:8px 0;
}
.msg-bubble pre code{background:none;padding:0}

.typing-indicator{display:flex;gap:5px;padding:4px 2px}
.typing-dot{
  width:7px;height:7px;background:var(--text-muted);border-radius:50%;
  animation:typingBounce 1.2s infinite ease-in-out;
}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes typingBounce{
  0%,80%,100%{transform:scale(0.6);opacity:0.4}
  40%{transform:scale(1);opacity:1}
}

.quick-chips{
  display:flex;gap:8px;padding:12px 16px;
  border-top:1.5px solid var(--border);overflow-x:auto;
  scrollbar-width:none;
}
.quick-chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:500;
  background:var(--surface2);border:1.5px solid var(--border);
  color:var(--text-soft);cursor:pointer;white-space:nowrap;
  transition:all 0.2s;font-family:var(--font-body);
}
.chip:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(124,92,252,0.06)}

.chat-input-row{
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;border-top:1.5px solid var(--border);
  background:var(--surface2);
}
.chat-input{
  flex:1;padding:11px 16px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:99px;
  font-family:var(--font-body);font-size:14px;color:var(--text);
  outline:none;transition:all 0.2s;
}
.chat-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,92,252,0.1)}
.chat-send{
  width:42px;height:42px;border-radius:50%;
  background:var(--accent2);border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;flex-shrink:0;transition:all 0.2s;
}
.chat-send:hover{background:#6a48f0;transform:scale(1.08)}
.chat-send:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* ─── CALENDAR ─── */
.cal-nav{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;
}
.cal-nav-group{display:flex;align-items:center;gap:12px}
.cal-nav-label{font-family:var(--font-display);font-size:16px;font-weight:700}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:5px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:20px;
}
.cal-day-hdr{
  text-align:center;font-size:11px;font-weight:700;
  letter-spacing:0.5px;color:var(--text-muted);padding:8px 0;text-transform:uppercase;
}
.cal-cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;
  transition:all 0.2s;color:var(--text-soft);
}
.cal-cell:not(.empty):hover{background:var(--surface2);color:var(--text)}
.cal-cell.today{background:var(--accent3);color:#fff !important;font-weight:700}
.cal-cell.selected{background:var(--accent2);color:#fff !important;box-shadow:0 2px 8px rgba(124,92,252,0.3)}
.cal-cell.empty{cursor:default}

.reminder-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:20px 24px;
}
.reminder-card h3{
  font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:16px;
}
.time-row{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.time-row label{font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.4px;text-transform:uppercase}
.time-select{
  padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;
  background:var(--surface2);color:var(--text);font-family:var(--font-body);
  font-size:14px;outline:none;cursor:pointer;transition:all 0.2s;
}
.time-select:focus{border-color:var(--accent2)}

/* ─── RESPONSIVE ─── */
@media(max-width:600px){

<script>
/* ═══════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════ */
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const icon = btn.querySelector('i');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  icon.className = inp.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}

const themeBtn = document.getElementById('theme-toggle');
themeBtn.addEventListener('click', () => {
  const d = document.documentElement;
  const dark = d.getAttribute('data-theme') === 'dark';
  d.setAttribute('data-theme', dark ? 'light' : 'dark');
  themeBtn.textContent = dark ? '🌙' : '☀️';
  localStorage.setItem('tf_theme', dark ? 'light' : 'dark');
});
(function () {
  const t = localStorage.getItem('tf_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
})();

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'result-msg show ' + type;
  setTimeout(() => { el.className = 'result-msg'; }, 3000);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* Simple markdown-like renderer for AI messages */
function renderMd(text) {
  return text
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escHtml(code.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^### (.+)$/gm, '<strong>$1</strong>')
    .replace(/^## (.+)$/gm, '<strong>$1</strong>')
    .replace(/^# (.+)$/gm, '<strong>$1</strong>')
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    .replace(/^[-•] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]+?<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .replace(/\n\n+/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^(?!<)/, '<p>')
    .replace(/(?<!>)$/, '</p>');
}

/* ═══════════════════════════════════════════════════════
   MAIN APP CLASS
═══════════════════════════════════════════════════════ */
class App {
  constructor() {
    this.user = null;
    this.calDate = new Date();
    this.selDate = null;
    this.chatHistory = [];
    this.reminderTimers = new Map();
    this.noteEditing = null;
    this._init();
  }

  _init() {
    document.getElementById('login-btn').addEventListener('click', () => this.login());
    document.getElementById('signup-btn').addEventListener('click', () => this.signup());
    document.getElementById('go-signup').addEventListener('click', e => { e.preventDefault(); this.showScreen('signup-screen'); });
    document.getElementById('go-login').addEventListener('click', e => { e.preventDefault(); this.showScreen('login-screen'); });
    document.getElementById('add-task-btn').addEventListener('click', () => this.addTask());
    document.getElementById('save-note-btn').addEventListener('click', () => this.saveNote());
    document.getElementById('prev-mo').addEventListener('click', () => this.changeMonth(-1));
    document.getElementById('next-mo').addEventListener('click', () => this.changeMonth(1));
    document.getElementById('prev-yr').addEventListener('click', () => this.changeYear(-1));
    document.getElementById('next-yr').addEventListener('click', () => this.changeYear(1));
    document.getElementById('set-rm-btn').addEventListener('click', () => this.setReminder());
    document.getElementById('chat-input').addEventListener('keypress', e => { if (e.key === 'Enter') this.sendMsg(); });

    document.querySelectorAll('.nav-btn[data-screen]').forEach(btn => {
      btn.addEventListener('click', () => this.showAppScreen(btn.dataset.screen));
    });

    this._initTimeDropdowns();
    this._checkRemembered();
    document.getElementById('t-date').value = new Date().toISOString().split('T')[0];
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  }

  /* ── STORAGE ── */
  _key(k) { return `tf_${this.user}_${k}`; }
  _get(k) { try { return JSON.parse(localStorage.getItem(this._key(k))); } catch { return null; } }
  _set(k, v) { try { localStorage.setItem(this._key(k), JSON.stringify(v)); } catch {} }

  /* ── AUTH ── */
  login() {
    const u = document.getElementById('l-user').value.trim();
    const p = document.getElementById('l-pass').value;
    const rem = document.getElementById('l-remember').checked;
    if (!u || !p) return showMsg('login-msg', 'Please fill in all fields', 'error');
    const users = JSON.parse(localStorage.getItem('tf_users') || '[]');
    const found = users.find(x => x.u === u && x.p === p);
    if (!found) return showMsg('login-msg', 'Invalid username or password', 'error');
    this.user = u;
    if (rem) localStorage.setItem('tf_rem', JSON.stringify({ u, p }));
    this._startApp();
  }

  signup() {
    const u = document.getElementById('s-user').value.trim();
    const p = document.getElementById('s-pass').value;
    const p2 = document.getElementById('s-pass2').value;
    if (!u || !p) return showMsg('signup-msg', 'Please fill in all fields', 'error');
    if (u.length < 3) return showMsg('signup-msg', 'Username must be 3+ characters', 'error');
    if (p.length < 4) return showMsg('signup-msg', 'Password must be 4+ characters', 'error');
    if (p !== p2) return showMsg('signup-msg', "Passwords don't match", 'error');
    const users = JSON.parse(localStorage.getItem('tf_users') || '[]');
    if (users.find(x => x.u === u)) return showMsg('signup-msg', 'Username already taken', 'error');
    users.push({ u, p, at: Date.now() });
    localStorage.setItem('tf_users', JSON.stringify(users));
    showMsg('signup-msg', 'Account created! Redirecting…', 'success');
    setTimeout(() => {
      this.showScreen('login-screen');
      document.getElementById('l-user').value = u;
    }, 1200);
  }

  _checkRemembered() {
    try {
      const r = JSON.parse(localStorage.getItem('tf_rem') || 'null');
      if (r) { document.getElementById('l-user').value = r.u; document.getElementById('l-pass').value = r.p; document.getElementById('l-remember').checked = true; }
    } catch {}
  }

  logout() {
    if (!confirm('Sign out?')) return;
    this.user = null;
    this.reminderTimers.forEach(t => clearTimeout(t));
    this.reminderTimers.clear();
    document.getElementById('nav-bar').classList.remove('visible');
    this.showScreen('login-screen');
    document.getElementById('l-user').value = '';
    document.getElementById('l-pass').value = '';
  }

  showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  _startApp() {
    this.showScreen('main-app');
    document.getElementById('hdr-user').textContent = this.user;
    document.getElementById('nav-bar').classList.add('visible');
    this.showAppScreen('home-screen');
    this._loadReminders();
  }

  showAppScreen(id) {
    document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
    const sc = document.getElementById(id);
    if (sc) sc.classList.add('active');
    document.querySelectorAll('.nav-btn[data-screen]').forEach(b => {
      b.classList.toggle('active', b.dataset.screen === id);
    });
    if (id === 'home-screen') this._renderHome();
    if (id === 'notes-screen') this._renderNotes();
    if (id === 'cal-screen') this._renderCal();
    if (id === 'ai-screen') this._initChat();
  }

  /* ── HOME ── */
  _renderHome() {
    this._renderQuote();
    this._renderTasks();
  }

  _renderQuote() {
    const quotes = [
      "Start where you are. Use what you have. Do what you can.",
      "Small steps daily lead to extraordinary results yearly.",
      "Progress is impossible without change. — George Bernard Shaw",
      "The secret of getting ahead is getting started. — Mark Twain",
      "You don't have to be great to start, but you have to start to be great.",
      "Focus on being productive instead of busy. — Tim Ferriss",
      "It always seems impossible until it's done. — Nelson Mandela",
      "Believe you can and you're halfway there. — Theodore Roosevelt",
      "Done is better than perfect.",
      "Your future is created by what you do today, not tomorrow.",
      "The only way to do great work is to love what you do. — Steve Jobs",
      "Don't count the days, make the days count. — Muhammad Ali",
    ];
    document.getElementById('daily-quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];
  }

  _renderTasks() {
    const tasks = this._get('tasks') || [];
    const el = document.getElementById('tasks-list');
    const badge = document.getElementById('tasks-badge');
    const pending = tasks.filter(t => !t.done).length;
    badge.textContent = pending + ' pending';
    if (!tasks.length) { el.innerHTML = '<div class="empty-state"><i class="fas fa-clipboard-list"></i><p>No tasks yet. Hit + to add one!</p></div>'; return; }
    el.innerHTML = tasks.map(t => this._taskHtml(t)).join('');
  }

  _taskHtml(t) {
    const today = new Date().toISOString().split('T')[0];
    const overdue = !t.done && t.date && t.date < today;
    return `
    <div class="task-card${t.star ? ' important' : ''}${t.done ? ' done' : ''}" id="tc-${t.id}">
      <div class="task-check${t.done ? ' checked' : ''}" onclick="app.toggleTask(${t.id})">
        ${t.done ? '<i class="fas fa-check"></i>' : ''}
      </div>
      <div class="task-body">
        <div class="task-title">${escHtml(t.name)}</div>
        ${t.desc ? `<div class="task-desc">${escHtml(t.desc)}</div>` : ''}
        <div class="task-meta">
          ${t.date ? `<span class="task-tag${overdue ? ' overdue' : ''}"><i class="fas fa-calendar-alt" style="font-size:10px"></i> ${t.date}</span>` : ''}
          ${t.star ? '<span class="task-tag important">⭐ Important</span>' : ''}
        </div>
        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill" id="pf-${t.id}" style="width:${t.progress}%"></div></div>
          <span class="progress-pct" id="pp-${t.id}">${t.progress}%</span>
        </div>
        <input type="range" min="0" max="100" value="${t.progress}" class="progress-slider"
          oninput="app.updateProgress(${t.id},this.value)">
      </div>
      <div class="task-actions">
        <button class="btn btn-icon btn-success" onclick="app.toggleTask(${t.id})" title="${t.done ? 'Undo' : 'Complete'}">
          <i class="fas ${t.done ? 'fa-undo' : 'fa-check'}"></i>
        </button>
        <button class="btn btn-icon btn-danger" onclick="app.deleteTask(${t.id})" title="Delete">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>`;
  }

  addTask() {
    const name = document.getElementById('t-name').value.trim();
    if (!name) return showMsg('task-msg', 'Task name is required', 'error');
    const tasks = this._get('tasks') || [];
    tasks.unshift({ id: Date.now(), name, desc: document.getElementById('t-desc').value.trim(), date: document.getElementById('t-date').value, star: document.getElementById('t-star').checked, done: false, progress: 0, at: Date.now() });
    this._set('tasks', tasks);
    showMsg('task-msg', '✓ Task added!', 'success');
    document.getElementById('t-name').value = '';
    document.getElementById('t-desc').value = '';
    document.getElementById('t-star').checked = false;
  }

  toggleTask(id) {
    const tasks = this._get('tasks') || [];
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    if (t.done) t.progress = 100;
    this._set('tasks', tasks);
    this._renderTasks();
  }

  deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    const tasks = (this._get('tasks') || []).filter(x => x.id !== id);
    this._set('tasks', tasks);
    this._renderTasks();
  }

  updateProgress(id, val) {
    const tasks = this._get('tasks') || [];
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.progress = +val;
    if (t.progress === 100) t.done = true;
    this._set('tasks', tasks);
    const pf = document.getElementById('pf-' + id);
    const pp = document.getElementById('pp-' + id);
    if (pf) pf.style.width = val + '%';
    if (pp) pp.textContent = val + '%';
  }

  /* ── NOTES ── */
  _renderNotes() {
    const notes = this._get('notes') || [];
    const el = document.getElementById('notes-list');
    const badge = document.getElementById('notes-badge');
    badge.textContent = notes.length;
    if (!notes.length) { el.innerHTML = '<div class="empty-state"><i class="fas fa-sticky-note"></i><p>No notes yet. Create one above.</p></div>'; return; }
    el.innerHTML = notes.map(n => `
      <div class="note-card">
        <div class="note-card-header">
          <span class="note-title">${escHtml(n.title)}</span>
          <span class="note-date">${new Date(n.at).toLocaleDateString()}</span>
        </div>
        <div class="note-body">${escHtml(n.body)}</div>
        <div class="note-foot">
          <button class="btn btn-sm btn-accent2" onclick="app.editNote(${n.id})"><i class="fas fa-pen"></i> Edit</button>
          <button class="btn btn-sm btn-danger" onclick="app.deleteNote(${n.id})"><i class="fas fa-trash"></i></button>
        </div>
      </div>`).join('');
  }

  saveNote() {
    const title = document.getElementById('n-title').value.trim();
    const body = document.getElementById('n-body').value.trim();
    if (!title || !body) return showMsg('note-msg', 'Please fill in title and content', 'error');
    const notes = this._get('notes') || [];
    if (this.noteEditing) {
      const n = notes.find(x => x.id === this.noteEditing);
      if (n) { n.title = title; n.body = body; }
      this.noteEditing = null;
    } else {
      notes.unshift({ id: Date.now(), title, body, at: Date.now() });
    }
    this._set('notes', notes);
    showMsg('note-msg', '✓ Note saved!', 'success');
    document.getElementById('n-title').value = '';
    document.getElementById('n-body').value = '';
    document.getElementById('note-form-title').textContent = 'New Note';
    document.getElementById('cancel-note-btn').style.display = 'none';
    this._renderNotes();
  }

  editNote(id) {
    const notes = this._get('notes') || [];
    const n = notes.find(x => x.id === id);
    if (!n) return;
    this.noteEditing = id;
    document.getElementById('n-title').value = n.title;
    document.getElementById('n-body').value = n.body;
    document.getElementById('note-form-title').textContent = 'Edit Note';
    document.getElementById('cancel-note-btn').style.display = '';
    document.getElementById('n-title').scrollIntoView({ behavior: 'smooth' });
  }

  cancelNote() {
    this.noteEditing = null;
    document.getElementById('n-title').value = '';
    document.getElementById('n-body').value = '';
    document.getElementById('note-form-title').textContent = 'New Note';
    document.getElementById('cancel-note-btn').style.display = 'none';
  }

  deleteNote(id) {
    if (!confirm('Delete this note?')) return;
    this._set('notes', (this._get('notes') || []).filter(x => x.id !== id));
    if (this.noteEditing === id) this.cancelNote();
    this._renderNotes();
  }

  /* ── CALENDAR ── */
  _renderCal() {
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('cal-month-label').textContent = MONTHS[this.calDate.getMonth()];
    document.getElementById('cal-year-label').textContent = this.calDate.getFullYear();
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => {
      const h = document.createElement('div');
      h.className = 'cal-day-hdr'; h.textContent = d; grid.appendChild(h);
    });
    const y = this.calDate.getFullYear(), m = this.calDate.getMonth();
    const first = new Date(y, m, 1);
    const last = new Date(y, m + 1, 0);
    let start = first.getDay(); if (start === 0) start = 7; start--;
    for (let i = 0; i < start; i++) {
      const e = document.createElement('div'); e.className = 'cal-cell empty'; grid.appendChild(e);
    }
    const today = new Date();
    for (let d = 1; d <= last.getDate(); d++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell'; cell.textContent = d;
      const isToday = y === today.getFullYear() && m === today.getMonth() && d === today.getDate();
      const isSel = this.selDate && y === this.selDate.getFullYear() && m === this.selDate.getMonth() && d === this.selDate.getDate();
      if (isToday) cell.classList.add('today');
      if (isSel) cell.classList.add('selected');
      cell.addEventListener('click', () => {
        this.selDate = new Date(y, m, d);
        this._renderCal();
      });
      grid.appendChild(cell);
    }
  }

  changeMonth(dir) { this.calDate.setMonth(this.calDate.getMonth() + dir); this._renderCal(); }
  changeYear(dir) { this.calDate.setFullYear(this.calDate.getFullYear() + dir); this._renderCal(); }

  _initTimeDropdowns() {
    const hs = document.getElementById('rm-hour'), ms = document.getElementById('rm-min');
    for (let h = 0; h < 24; h++) { const o = document.createElement('option'); o.value = h; o.textContent = String(h).padStart(2,'0'); hs.appendChild(o); }
    for (let m = 0; m < 60; m++) { const o = document.createElement('option'); o.value = m; o.textContent = String(m).padStart(2,'0'); ms.appendChild(o); }
    const n = new Date(); n.setMinutes(n.getMinutes() + 5);
    hs.value = n.getHours(); ms.value = n.getMinutes();
  }

  setReminder() {
    if (!this.selDate) return alert('Please select a date on the calendar first.');
    const h = +document.getElementById('rm-hour').value;
    const m = +document.getElementById('rm-min').value;
    const msg = document.getElementById('rm-msg').value.trim();
    if (!msg) return alert('Please enter a reminder message.');
    const dt = new Date(this.selDate.getFullYear(), this.selDate.getMonth(), this.selDate.getDate(), h, m);
    if (dt <= new Date()) return alert('Please choose a future time.');
    const r = { id: Date.now(), msg, ts: dt.getTime() };
    const reminders = this._get('reminders') || [];
    reminders.push(r); this._set('reminders', reminders);
    this._scheduleReminder(r);
    alert(`✅ Reminder set for ${dt.toLocaleString()}`);
    document.getElementById('rm-msg').value = '';
  }

  _scheduleReminder(r) {
    const delay = r.ts - Date.now();
    if (delay <= 0) return;
    const tid = setTimeout(() => {
      alert(`🔔 REMINDER: ${r.msg}`);
      if (Notification.permission === 'granted') new Notification('TaskFlow Reminder', { body: r.msg });
      this._set('reminders', (this._get('reminders') || []).filter(x => x.id !== r.id));
    }, delay);
    this.reminderTimers.set(r.id, tid);
  }

  _loadReminders() {
    (this._get('reminders') || []).forEach(r => {
      if (r.ts > Date.now()) this._scheduleReminder(r);
    });
  }

  /* ══════════════════════════════════════════════════
     AI ASSISTANT — powered by Claude API
  ══════════════════════════════════════════════════ */
  _initChat() {
    if (this.chatHistory.length > 0) return; // already started
    this._addBotMsg(`Hey **${this.user}** 👋 I'm your TaskFlow AI assistant, powered by Claude.\n\nI can help you with task management, productivity tips, coding, study strategies, career advice, and anything else on your mind.\n\nWhat can I do for you today?`);
  }

  quickAction(action) {
    const prompts = {
      breakdown: "How do I break down a big complex task into smaller actionable steps?",
      prioritize: "Help me think about how to prioritize my tasks effectively using proven frameworks.",
      tips: "Give me your top productivity tips for getting more done with focus.",
      coding: "What's the best way to learn programming and build real projects?",
      study: "What are the most effective study techniques backed by science?"
    };
    const msg = prompts[action];
    if (msg) { document.getElementById('chat-input').value = msg; this.sendMsg(); }
  }

  async sendMsg() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const sendBtn = document.getElementById('chat-send');
    sendBtn.disabled = true;

    this._addUserMsg(text);
    this.chatHistory.push({ role: 'user', content: text });

    // show typing indicator
    const typingId = this._addTyping();

    try {
      const tasks = this._get('tasks') || [];
      const taskSummary = tasks.length
        ? `User has ${tasks.length} tasks: ${tasks.slice(0, 5).map(t => `"${t.name}" (${t.done ? 'done' : 'pending'})`).join(', ')}${tasks.length > 5 ? ` and ${tasks.length - 5} more` : ''}.`
        : 'User has no tasks yet.';

      const systemPrompt = `You are TaskFlow AI, a smart, friendly, and practical assistant built into a productivity app. The user's name is ${this.user}.

Context about their tasks: ${taskSummary}

Your personality:
- Warm, encouraging, and direct
- Give concrete, actionable advice
- Use markdown formatting (bold, lists, code blocks) when helpful
- Be concise but thorough — don't pad with filler
- When discussing code, always use proper code blocks
- Reference the user's actual tasks when relevant
- You know they may be a student or professional in Malawi or elsewhere — be globally relevant

You can help with: task management, productivity, coding/programming, studying, career advice, writing, general knowledge, brainstorming, and friendly conversation.`;

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: systemPrompt,
          messages: this.chatHistory
        })
      });

      this._removeTyping(typingId);

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error ${response.status}`);
      }

      const data = await response.json();
      const reply = data.content?.find(b => b.type === 'text')?.text || "Sorry, I didn't get a response. Please try again.";

      this.chatHistory.push({ role: 'assistant', content: reply });
      this._addBotMsg(reply);

    } catch (err) {
      this._removeTyping(typingId);
      this._addBotMsg(`⚠️ **Connection issue:** ${err.message}\n\nMake sure you're connected to the internet and try again.`);
      // remove failed user message from history
      this.chatHistory.pop();
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  _addUserMsg(text) {
    const msgs = document.getElementById('chat-msgs');
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-avatar"><i class="fas fa-user"></i></div><div class="msg-bubble">${escHtml(text)}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  _addBotMsg(md) {
    const msgs = document.getElementById('chat-msgs');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `<div class="msg-avatar"><i class="fas fa-robot"></i></div><div class="msg-bubble">${renderMd(md)}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  _addTyping() {
    const msgs = document.getElementById('chat-msgs');
    const id = 'typing-' + Date.now();
    const div = document.createElement('div');
    div.className = 'msg bot'; div.id = id;
    div.innerHTML = `<div class="msg-avatar"><i class="fas fa-robot"></i></div>
      <div class="msg-bubble"><div class="typing-indicator">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div></div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return id;
  }

  _removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
}

/* ── BOOT ── */
document.addEventListener('DOMContentLoaded', () => { window.app = new App(); });
</script>
